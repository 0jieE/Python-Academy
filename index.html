<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyAcademy · Python contest training</title>
    <meta name="description" content="Self-paced Python lessons, cheat sheets and practice problems for programming competitions." />
    <meta name="theme-color" content="#059669" />
    <script>
      // Apply the theme before first paint (no flash). Mirrors src/lib/theme.ts.
      ;(function () {
        var pref
        try {
          pref = localStorage.getItem('pyacademy:theme')
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
